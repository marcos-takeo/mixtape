<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Content-Security-Policy — kept in sync with what this app actually
      talks to. If you add a new external host (another lyrics/metadata
      provider, etc.), it needs adding here too or it'll be silently
      blocked. See the "Content-Security-Policy" section in README.md for
      what each host is for, and for the stronger header-based version
      (this meta tag can't set frame-ancestors — the README explains why
      and gives host config files that can).

      A gotcha worth remembering: connect-src is enforced against where a
      request actually ENDS UP, not just the URL it started at — Cover Art
      Archive's own JSON metadata lives at coverartarchive.org, but the
      actual image is served via a redirect to an archive.org CDN
      subdomain (a different host, picked unpredictably per image, hence
      the wildcard https://*.archive.org below). Any host that redirects
      elsewhere needs its real destination allowed too, not just the one
      you call directly.

      style-src allows 'unsafe-inline': this app sets a lot of genuinely
      dynamic inline style="" attributes (drag position, progress bars,
      per-playlist column widths) that can't be pinned to a static hash.
      That's a real, deliberate trade-off, not an oversight — see the
      README section for the reasoning. script-src has no such exception:
      every script here is either same-origin or the one named Google host.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://accounts.google.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' blob: data:;
        media-src 'self' blob:;
        connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://musicbrainz.org https://coverartarchive.org https://archive.org https://*.archive.org https://lrclib.net;
        frame-src https://accounts.google.com;
        worker-src 'self';
        manifest-src 'self';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
      "
    />
    <title>Mixtape - Song player</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/register-sw.js"></script>
  </body>
</html>
